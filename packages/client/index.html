<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>F1 Manager Multiplayer</title>
    <script>
      // Desregistrar Service Workers antigos que possam estar interceptando localhost
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
        });
      }
    </script>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1115;
        --panel: #111a20;
        --panel-2: #18232b;
        --line: #273640;
        --text: #f2f6f8;
        --muted: #b0bfc9;
        --accent: #00d26a;
        --warn: #f2c94c;
        --danger: #ff8a80;
        --display: "Barlow Condensed", sans-serif;
      }
      body {
        margin: 0;

        background-color: var(--bg);
        color: var(--text);
        font-family: Barlow, Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
